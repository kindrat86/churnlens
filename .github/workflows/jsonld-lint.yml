name: JSON-LD Lint

# Blocks on any invalid <script type="application/ld+json"> block (unparsable
# JSON, missing @context/@type). Added 2026-07-24 as part of a portfolio-wide
# structured-data sweep (no bugs found here yet, but no guard rail existed).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-jsonld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON-LD
        run: python3 scripts/validate_jsonld.py .
      # Stronger second pass over the same surface: catches the two corruption
      # signatures seen in production (the `schema.org","` → `***` clobber and a
      # stray template-literal backtick closing a schema) plus blocks that
      # JSON.parse accepts but whose @context was corrupted — the Python lint
      # waves those through. Scans "." because this repo IS the deploy root
      # (outputDirectory ".", buildCommand null), so committed HTML is shipped
      # HTML. See ~/.growth-engine/GUARDRAILS.md rule 3.
      - name: Verify shipped JSON-LD
        run: node scripts/verify-jsonld.mjs .
      # The step above names "." explicitly and so can never lint the wrong tree.
      # This one takes no argument on purpose: the default was hardcoded to
      # `dist` until 2026-07-25, so an argument-less run exited 1 on 78 stale
      # .vercelignored pages while CI stayed green — a broken invocation nobody's
      # CI exercised. The default now reads vercel.json's outputDirectory; this
      # step is what keeps it honest, since it is the invocation people type by
      # hand and the one a plain `node scripts/verify-jsonld.mjs` gets.
      - name: Verify JSON-LD via the default target
        run: node scripts/verify-jsonld.mjs
      # public/ is deliberately NOT in the script's SKIP set: /public/<path>/
      # served those 77 files 200, indexable, for a while (fixed in be5ede5), so
      # they are linted as part of "." above. Naming it again is redundant by
      # design — it asserts the surface directly, so a green gate cannot be
      # bought by quietly adding public/ back to SKIP.
      - name: Verify JSON-LD under public/
        run: node scripts/verify-jsonld.mjs public

  release-blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # These three were release blockers documented only in prose, so they were
      # enforced by whoever happened to remember them. Each one corresponds to a
      # defect that actually reached production on this site:
      #   * redirect loops   — four self-referential vercel.json rules
      #   * unreachable page — /7-revenue-churn-red-flags 404'd with the file present
      #                        (no cleanUrls; every clean URL needs a rewrite)
      #   * dead links/orphans — 56 dead internal links, 23 orphans
      - name: Link graph and routing audit
        run: python3 scripts/linkgraph/audit.py .
      # Eleven internal docs, including a report enumerating this site's own
      # security weaknesses, were served publicly because .vercelignore covered
      # *.py but never *.md.
      - name: No internal docs exposed
        run: python3 scripts/check_public_docs.py
      # Three separate waves of "these benchmarks come from our own customers"
      # reached production (2,400+ SaaS companies; aggregated anonymized user
      # data; ChurnLens analysis of buyer-side CSV uploads 2024-2026, including
      # in a CC BY 4.0 dataset other people are invited to cite). There is no
      # first-party corpus and there cannot be one: api/ has no upload endpoint
      # and the free analyzer never transmits the file. The rule existed in
      # CLAUDE.md as a two-literal grep that nobody ran, and wave 3 walked
      # straight past it by saying "uploads" instead of "SaaS". Same fix as the
      # three blockers above: stop trusting prose, run it.
      - name: No unbacked first-party-data claims
        run: python3 scripts/check_provenance_claims.py
